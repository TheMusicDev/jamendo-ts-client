        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

components:
  securitySchemes:
    apikey_auth:
      type: apiKey
      in: query
      name: client_id
      description: >-
        Every API call requires a `client_id` query parameter. Get one by
        signing up at https://devportal.jamendo.com/ and creating an
        application. Public test client_id for read-only testing: `709fa152`
        (testing only).
    oauth2:
      type: oauth2
      description: >-
        Standard OAuth2 Authorization Code Grant flow (IETF draft #31).
        Access token is valid 2 hours; refresh via `grant_type=refresh_token`.
        Note: Jamendo's write methods pass `access_token` as a normal
        POST-body/query parameter rather than an `Authorization: Bearer`
        header — see each `setuser/*` operation's requestBody.
      flows:
        authorizationCode:
          authorizationUrl: https://api.jamendo.com/v3.0/oauth/authorize
          tokenUrl: https://api.jamendo.com/v3.0/oauth/grant
          scopes:
            music: "Write a user's music properties (playlists, favorite tracks/artists/albums)."

  parameters:
    Format:
      name: format
      in: query
      required: false
      description: Response format.
      schema: { type: string, enum: [xml, json, jsonpretty], default: json }
    Callback:
      name: callback
      in: query
      required: false
      description: JSONP callback wrapper (json + GET only).
      schema: { type: string }
    Offset:
      name: offset
      in: query
      required: false
      description: Pagination offset.
      schema: { type: integer, minimum: 0 }
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, max 200, or "all" (capped 200).
      schema: { type: string, default: "10" }
    FullCount:
      name: fullcount
      in: query
      required: false
      description: Adds `results_fullcount` to headers.
      schema: { type: boolean, default: false }
    AudioFormat:
      name: audioformat
      in: query
      required: false
      description: Audio format for the `audio` field.
      schema: { type: string, enum: [mp31, mp32, ogg, flac], default: mp31 }
    AudioDLFormat:
      name: audiodlformat
      in: query
      required: false
      description: Audio download format for `audiodownload`. Defaults to `audioformat`'s value, or mp32.
      schema: { type: string, enum: [mp31, mp32, ogg, flac] }
    ImageSizeStandard:
      name: imagesize
      in: query
      required: false
      description: Cover px size.
      schema: { $ref: '#/components/schemas/ImageSizeStandardEnum' }
    ImageSizeStandardParamAlbum:
      name: album_imagesize
      in: query
      required: false
      description: Album cover px size.
      schema: { $ref: '#/components/schemas/ImageSizeStandardEnum' }
    ImageSizeUser:
      name: imagesize
      in: query
      required: false
      description: User avatar px size.
      schema: { type: integer, enum: [30, 50, 100] }
    ImageSizeRadio:
      name: imagesize
      in: query
      required: false
      description: Radio image px size.
      schema: { type: integer, enum: [150, 30] }

  responses:
    BadRequest:
      description: >-
        Parameter type/range/format error, or a missing required parameter.
        See `docs/02-response-codes.md` — most API-level errors are actually
        returned as HTTP 200 with `headers.status: "failed"`; confirm this
        response's real HTTP status against the live API.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Invalid or expired access token / client_id.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Insufficient scope, or suspended application.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Entity/subentity path doesn't exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: App or IP exceeded permitted rate limit.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: Generic unidentified error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    ImageSizeStandardEnum:
      type: integer
      enum: [25, 35, 50, 55, 60, 65, 70, 75, 85, 100, 130, 150, 200, 300, 400, 500, 600]

    Headers:
      type: object
      description: Envelope header present in every response document.
      properties:
        status:
          type: string
          enum: [success, failed]
        code:
          type: integer
          description: 0 on success, non-zero error id on failure. See `docs/02-response-codes.md` for the full error code table.
        error_message:
          type: string
          description: Error type + contextual description, empty on success.
        warnings:
          type: string
          description: Warning messages if any; warnings do not fail the request.
        results_count:
          type: integer
          description: Number of items in `results` for this page.
        results_fullcount:
          type: integer
          description: Total matching result count across all pages; only present when `fullcount=true` was requested.
      required: [status, code, error_message, warnings]

    Error:
      type: object
      description: Shared error envelope used by all endpoints' 4xx/5xx responses.
      properties:
        headers:
          type: object
          properties:
            status: { type: string, enum: [success, failed] }
            code: { type: integer }
            error_message: { type: string }
            warnings: { type: string }
        results:
          type: array
          items: {}

    MusicInfoTags:
      type: object
      properties:
        genres: { type: array, items: { type: string } }
        instruments: { type: array, items: { type: string } }
        vartags: { type: array, items: { type: string } }

    MusicInfo:
      type: object
      description: Present on tracks only when `include=musicinfo` is requested.
      properties:
        vocalinstrumental: { type: string, enum: [vocal, instrumental, ""] }
        lang: { type: string, description: Lyrics language 2-letter code, empty if not applicable. }
        gender: { type: string, enum: [male, female, ""] }
        acousticelectric: { type: string, enum: [acoustic, electric, ""] }
        speed: { type: string, enum: [verylow, low, medium, high, veryhigh, ""] }
        tags: { $ref: '#/components/schemas/MusicInfoTags' }

    Waveform:
      type: object
      description: >-
        Large numeric array (hundreds of values per track); full fidelity
        not needed for consumers, modeled as a plain array of integers.
      properties:
        peaks:
          type: array
          items: { type: integer }

    Track:
      type: object
      description: >-
        Fields present depend on `include`; `musicinfo` is only present
        when `include=musicinfo` was requested.
      properties:
        id: { type: string }
        name: { type: string }
        duration: { type: integer, description: Seconds. }
        artist_id: { type: string }
        artist_name: { type: string }
        artist_idstr: { type: string }
        album_name: { type: string, description: Empty for singles (tracks with no album). }
        album_id: { type: string, description: Empty for singles (tracks with no album). }
        license_ccurl: { type: string, format: uri }
        position: { type: integer, description: Track position within its album; not meaningful for singles. }
        releasedate: { type: string, format: date }
        album_image: { type: string, format: uri }
        audio: { type: string, format: uri }
        audiodownload:
          type: string
          format: uri
          description: Becomes an empty string when `audiodownload_allowed` is false (since Aug 2020).
        prourl: { type: string }
        shorturl: { type: string, format: uri }
        shareurl: { type: string, format: uri }
        waveform: { $ref: '#/components/schemas/Waveform' }
        image: { type: string, format: uri }
        audiodownload_allowed: { type: boolean }
        content_id_free: { type: boolean }
        musicinfo: { $ref: '#/components/schemas/MusicInfo' }

    TrackWithScore:
      allOf:
        - $ref: '#/components/schemas/Track'
        - type: object
          properties:
            score: { type: number, maximum: 1, description: Similarity relevance score. }

    AlbumTrackItem:
      type: object
      description: A track nested under an album (`/albums/tracks`, same shape reused by `/playlists/tracks`).
      properties:
        count: { type: string }
        id: { type: string }
        position: { type: string }
        name: { type: string }
        duration: { type: string }
        license_ccurl: { type: string, format: uri }
        audio: { type: string, format: uri }
        audiodownload: { type: string, format: uri, description: Empty string when `audiodownload_allowed` is false. }
        audiodownload_allowed: { type: boolean }

    ArtistTrackItem:
      type: object
      description: A track nested under an artist (`/artists/tracks`).
      properties:
        album_id: { type: string, description: Empty for singles (tracks with no album). }
        album_name: { type: string, description: Empty for singles (tracks with no album). }
        id: { type: string }
        name: { type: string }
        duration: { type: string }
        releasedate: { type: string, format: date }
        license_ccurl: { type: string, format: uri }
        album_image: { type: string, format: uri, description: Empty for singles (tracks with no album). }
        image: { type: string, format: uri }
        audio: { type: string, format: uri }
        audiodownload: { type: string, format: uri, description: Empty string when `audiodownload_allowed` is false. }
        audiodownload_allowed: { type: boolean }

    PlaylistTrackItem:
      allOf:
        - $ref: '#/components/schemas/AlbumTrackItem'

    Album:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        releasedate: { type: string, format: date }
        artist_id: { type: string }
        artist_name: { type: string }
        image: { type: string, format: uri }
        zip: { type: string, format: uri, description: Empty string when `zip_allowed` is false (since Apr 2022). }
        zip_allowed: { type: boolean }
        shorturl: { type: string, format: uri }
        shareurl: { type: string, format: uri }

    AlbumWithTracks:
      allOf:
        - $ref: '#/components/schemas/Album'
        - type: object
          properties:
            tracks:
              type: array
              items: { $ref: '#/components/schemas/AlbumTrackItem' }

    LocalizedText:
      type: object
      description: Per-language text; may contain raw HTML. Absent languages default to an empty string.
      properties:
        en: { type: string }
        fr: { type: string }
        es: { type: string }
        de: { type: string }
        pl: { type: string }
        it: { type: string }
        ru: { type: string }
        pt: { type: string }
        ja: { type: string }

    AlbumMusicInfo:
      allOf:
        - $ref: '#/components/schemas/Album'
        - type: object
          properties:
            musicinfo:
              type: object
              properties:
                tags:
                  type: array
                  items: { type: string }
                  description: >-
                    Live examples show heavy duplication (same tag repeated
                    per matched sub-attribute) — confirm actual dedup
                    behavior against the live API.
                description: { $ref: '#/components/schemas/LocalizedText' }

    Artist:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        website: { type: string, description: Empty string if not set. }
        joindate: { type: string, format: date }
        image: { type: string, format: uri }
        shorturl: { type: string, format: uri }
        shareurl: { type: string, format: uri }

    ArtistWithTracks:
      allOf:
        - $ref: '#/components/schemas/Artist'
        - type: object
          properties:
            tracks:
              type: array
              items: { $ref: '#/components/schemas/ArtistTrackItem' }

    ArtistAlbumItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        releasedate: { type: string, format: date }
        image: { type: string, format: uri }

    ArtistWithAlbums:
      allOf:
        - $ref: '#/components/schemas/Artist'
        - type: object
          properties:
            albums:
              type: array
              items: { $ref: '#/components/schemas/ArtistAlbumItem' }

    ArtistLocation:
      type: object
      properties:
        id: { type: string }
        longitude: { type: string }
        latitude: { type: string }
        country: { type: string, description: ISO 3166-1 alpha-3 code. }
        city: { type: string }

    ArtistWithLocations:
      allOf:
        - $ref: '#/components/schemas/Artist'
        - type: object
          properties:
            locations:
              type: array
              items: { $ref: '#/components/schemas/ArtistLocation' }

    ArtistMusicInfo:
      allOf:
        - $ref: '#/components/schemas/Artist'
        - type: object
          properties:
            musicinfo:
              type: object
              properties:
                tags: { type: array, items: { type: string } }
                description: { $ref: '#/components/schemas/LocalizedText' }

    Playlist:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        creationdate: { type: string, format: date }
        user_id: { type: string }
        user_name: { type: string }
        zip: { type: string, format: uri, description: 'May contain fewer tracks than the playlist actually has (server-side ~100-track internal limit).' }
        shorturl: { type: string, format: uri }
        shareurl: { type: string, format: uri }

    PlaylistWithTracks:
      allOf:
        - $ref: '#/components/schemas/Playlist'
        - type: object
          properties:
            tracks:
              type: array
              items: { $ref: '#/components/schemas/PlaylistTrackItem' }

    Radio:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        dispname: { type: string }
        type: { type: string, enum: [www, pro] }
        image: { type: string, format: uri }

    RadioPlayingNow:
      type: object
      properties:
        track_id: { type: integer, description: 0 when nothing is currently playing. }
        artist_id: { type: integer }
        album_id: { type: integer }
        album_name: { type: string }
        track_name: { type: string }
        track_image: { type: string, format: uri }
        artist_name: { type: string }

    RadioStream:
      allOf:
        - $ref: '#/components/schemas/Radio'
        - type: object
          properties:
            stream:
              type: string
              format: uri
              description: >-
                Per official Jamendo docs this stream link is documented as
                broken and may never be fixed — treat as unreliable.
            playingnow: { $ref: '#/components/schemas/RadioPlayingNow' }
            callmeback:
              type: string
              description: Milliseconds until the current track finishes and the next starts; empty string when not applicable.

    AlbumReview:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        text: { type: string }
        dateadded: { type: string, format: date }
        agreecnt: { type: string }
        lang: { type: string }
        user_id: { type: string }
        user_name: { type: string }
        user_dispname: { type: string }
        score: { type: string }
        album_id: { type: string }
        album_name: { type: string }
        artist_id: { type: string }

    TrackReview:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        text: { type: string }
        dateadded: { type: string, format: date }
        agreecnt: { type: string }
        lang: { type: string }
        user_id: { type: string }
        user_name: { type: string, description: 'Live examples show values that look like real email addresses — treat as potentially PII.' }
        user_dispname: { type: string }
        score: { type: string }
        track_id: { type: string }
        track_name: { type: string }
        album_id: { type: string }
        artist_id: { type: string }
        track_audiodownload_allowed: { type: boolean }
        track_license_ccurl: { type: string, format: uri }
        track_audio: { type: string, format: uri }
        track_audiodownload: { type: string, format: uri, description: Empty string when `track_audiodownload_allowed` is false. }

    User:
      type: object
      properties:
        name: { type: string }
        dispname: { type: string }
        id: { type: string }
        lang: { type: string }
        creationdate: { type: string, format: date }
        image: { type: string, format: uri }

    UserArtistItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string, format: uri }
        joindate: { type: string, format: date }
        updatedate: { type: string, description: 'Date-time the fan relation was established, e.g. "2013-09-09 12:01:44".' }
        relations:
          type: object
          properties:
            fan: { type: string }

    UserWithArtists:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            artists:
              type: array
              items: { $ref: '#/components/schemas/UserArtistItem' }

    UserAlbumItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        releasedate: { type: string, format: date }
        artist_id: { type: string }
        artist_name: { type: string }
        updatedate: { type: string, description: Date-time the album was added to myalbums. }
        image: { type: string, format: uri }
        relations:
          type: object
          properties:
            myalbums: { type: string }

    UserWithAlbums:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            albums:
              type: array
              items: { $ref: '#/components/schemas/UserAlbumItem' }

    UserTrackItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        releasedate: { type: string, format: date }
        artist_id: { type: string }
        duration: { type: string }
        artist_name: { type: string }
        license_ccurl: { type: string, format: uri }
        updatedate: { type: string, description: Date-time of the latest like/favorite/review action. }
        album_image: { type: string, format: uri }
        image: { type: string, format: uri }
        audio: { type: string, format: uri }
        audiodownload: { type: string, format: uri, description: Empty string when `audiodownload_allowed` is false. }
        relations:
          type: object
          description: Numeric scores; review is the review score (1-10), favorite/like are implicit scores (9/8) when set.
          properties:
            review: { type: string }
            favorite: { type: string }
            like: { type: string }
        audiodownload_allowed: { type: boolean }

    UserWithTracks:
      type: object
      description: >-
        This endpoint's user object uses `avatar_type`/`avatar` instead of
        `image`, per the source docs' documented field list.
      properties:
        name: { type: string }
        dispname: { type: string }
        id: { type: string }
        lang: { type: string }
        creationdate: { type: string, format: date }
        avatar_type: { type: string }
        avatar: { type: string, description: 'File extension of the avatar image, e.g. "jpg".' }
        tracks:
          type: array
          items: { $ref: '#/components/schemas/UserTrackItem' }

    FeedImages:
      type: object
      properties:
        size996_350: { type: string, format: uri }
        size315_111: { type: string, format: uri }
        size600_211: { type: string, format: uri }
        size470_165: { type: string, format: uri }

    Feed:
      type: object
      properties:
        id: { type: string }
        title: { $ref: '#/components/schemas/LocalizedText' }
        link: { type: string, format: uri }
        position: { type: string }
        lang: { type: array, items: { type: string }, description: Language codes this feed is translated into. }
        date_start: { type: string }
        date_end: { type: string }
        text: { $ref: '#/components/schemas/LocalizedText' }
        type: { type: string, enum: [album, artist, playlist, track, news, interview, contest, video, update] }
        joinid: { type: string, description: Related entity's id when `type` is album/track/artist/playlist; "0" otherwise. }
        subtitle: { type: array, items: { type: string } }
        target: { type: string, enum: [all, logged, notlogged] }
        images: { $ref: '#/components/schemas/FeedImages' }

    AutocompleteMatch:
      type: object
      properties:
        match: { type: string }
        count:
          type: integer
          description: Only present when `matchcount=true` was requested.

    AutocompleteResults:
      type: object
      description: >-
        Non-standard shape — keyed by entity, not an array. Only requested
        entities present if the `entity` filter was used.
      properties:
        tags:
          type: array
          items: { $ref: '#/components/schemas/AutocompleteMatch' }
          description: matchcount for tags reflects tracks only, not albums/artists.
        artists:
          type: array
          items: { $ref: '#/components/schemas/AutocompleteMatch' }
        tracks:
          type: array
          items: { $ref: '#/components/schemas/AutocompleteMatch' }
        albums:
          type: array
          items: { $ref: '#/components/schemas/AutocompleteMatch' }
