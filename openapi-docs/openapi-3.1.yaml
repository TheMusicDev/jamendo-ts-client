  /autocomplete:
    get:
      operationId: autocomplete
      tags: [autocomplete]
      deprecated: false
      summary: Autocomplete tracks, albums, artists, and tags by name prefix
      description: >-
        Builds an autocomplete over Jamendo tracks, albums, artists, and
        tags. By default searches all four entities; narrow with `entity`.
        `prefix` is matched as a name prefix (SQL `WHERE name LIKE
        'prefix%' GROUP BY entity, name ORDER BY name, COUNT(*) DESC`),
        minimum length 2. No entity id is returned — a follow-up lookup
        must go by name, which is not unique. **Non-standard response
        shape**: `results` is an object keyed by entity, not the usual
        array envelope used by every other read endpoint.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - name: limit
          in: query
          required: false
          description: Results per entity.
          schema: { type: string }
        - $ref: '#/components/parameters/FullCount'
        - name: prefix
          in: query
          required: true
          description: Name prefix to search, min length 2.
          schema: { type: string, minLength: 2 }
        - name: entity
          in: query
          required: false
          description: Which entities to search; default all four.
          schema:
            type: array
            items: { type: string, enum: [artists, albums, tracks, tags] }
        - name: matchcount
          in: query
          required: false
          description: Include match count per result; tags matchcount reflects tracks only, not albums/artists.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: >-
            Autocomplete matches keyed by entity. Only requested entities
            present if the `entity` filter was used.
          content:
            application/json:
              schema:
                type: object
                properties:
                  headers: { $ref: '#/components/schemas/Headers' }
                  results: { $ref: '#/components/schemas/AutocompleteResults' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

