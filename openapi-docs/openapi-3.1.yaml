        - name: id
          in: query
          required: false
          schema: { type: array, items: { type: integer } }
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: namesearch
          in: query
          required: false
          schema: { type: string }
        - name: hasimage
          in: query
          required: false
          schema: { type: string, enum: ["true", "1"] }
        - name: datebetween
          in: query
          required: false
          schema: { type: string }
        - name: haslocation
          in: query
          required: false
          description: Only artists with (true) or without (false) declared locations.
          schema: { type: boolean }
        - name: location_country
          in: query
          required: false
          description: >-
            Artist country, ISO 3166-1 alpha-3 code(s). The full code list
            is omitted here for brevity — use the standard ISO 3166-1
            alpha-3 list (e.g. USA, ITA, GBR, DEU, FRA, ...).
          schema: { type: array, items: { type: string, minLength: 3, maxLength: 3 } }
        - name: location_city
          in: query
          required: false
          schema: { type: string }
        - name: location_coords
          in: query
          required: false
          description: "`<latitude>_<longitude>` coordinate pair, both numeric."
          schema: { type: string, examples: ["45.4637_9.18813"] }
        - name: location_radius
          in: query
          required: false
          description: Search radius in km around location_coords; ignored if location_coords not set.
          schema: { type: integer, default: 1 }
