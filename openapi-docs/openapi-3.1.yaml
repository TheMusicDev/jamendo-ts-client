    get:
      operationId: listPlaylists
      tags: [playlists]
      deprecated: false
      summary: List playlists
      description: >-
        A playlist is a dynamic collection of tracks; the owning user can
        modify/delete/publish/mask it at any time. `zip` is the URL for the
        playlist's tracks as a high-quality mp3 zip — the zip may contain
        fewer tracks than the playlist actually has (server-side ~100-track
        internal limit). Accepts but does not require `access_token`.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FullCount'
        - name: order
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [name, id, creationdate] }
        - name: id
          in: query
          required: false
          schema: { type: array, items: { type: integer } }
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: namesearch
          in: query
          required: false
          schema: { type: string }
        - name: user_id
          in: query
          required: false
          description: One or more author id (no access_token required).
          schema: { type: array, items: { type: integer } }
        - name: access_token
          in: query
          required: false
          description: OAuth2 access token, to scope results to a specific authenticated Jamendo user.
          schema: { type: string }
        - name: user_name
          in: query
          required: false
          schema: { type: string }
        - name: datebetween
          in: query
          required: false
          description: >-
            Creation date range, both bounds required. Source doc's Type
            column literally says "must be both integer" for this field —
            almost certainly a copy-paste error from another page's date-range
            param (should be yyyy-mm-dd like every other entity's
            datebetween); confirm against the live API.
          schema: { type: string }
        - name: audioformat
          in: query
          required: false
          description: Audio format for fileurl; only mp32 exists today.
          schema: { type: string, enum: [mp32] }
      responses:
        '200':
          description: List of playlists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  headers: { $ref: '#/components/schemas/Headers' }
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/Playlist' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /playlists/file:
    get:
      operationId: downloadPlaylistFile
      tags: [playlists]
      deprecated: false
      summary: Download a playlist's zip file
      description: >-
        Exception to the normal response shape — HTTP-redirects to the
        requested zip file URL instead of returning a document. Does not
        inherit `playlists` parameter declarations. An invalid request
        triggers a plain HTTP error (404 or 500), not the standard `Error`
        JSON envelope.
      security:
        - apikey_auth: []
      parameters:
        - name: id
          in: query
          required: true
          description: Single playlist id (redirect semantics; only one).
          schema: { type: integer }
        - name: audioformat
          in: query
          required: false
          description: Only mp32 (mp3 192kbps) exists today.
          schema: { type: string, enum: [mp32] }
      responses:
        '302':
          description: Redirect to the zip file URL (binary redirect, not a JSON document).
          headers:
            Location:
              schema: { type: string, format: uri }
        '404':
          description: Playlist or file doesn't exist. Plain HTTP error, not the standard `Error` JSON envelope.
        '500':
          description: Malformed request. Plain HTTP error, not the standard `Error` JSON envelope.

