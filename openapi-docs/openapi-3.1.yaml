openapi: 3.1.0
info:
  title: Jamendo API
  summary: Read and write access to Jamendo's free-music catalog
  version: "3.0"
  description: >-
    Jamendo API v3.0 — 20+ read methods over a catalog of ~500K tracks,
    OAuth2-based authentication, and write methods to manage a user's
    library. Not fully RESTful ("RESTlike" per Jamendo): every method is an
    entity or entity+subentity path, GET for reads, POST for writes, no
    entity id as a URL path segment. Every response document (json,
    jsonpretty, or xml) wraps its payload in a `headers` object plus the
    requested `results`.


    This spec is generated independently from the markdown mirror under
    `docs/` (not converted from `openapi-3.0.yaml`) and uses OpenAPI 3.1 /
    JSON Schema 2020-12 idioms throughout. Jamendo's documented field
    semantics use empty-string or zero sentinel values for "not applicable"
    (e.g. `audiodownload: ""` when download isn't allowed) rather than JSON
    `null`, so this spec does not use `type: [X, null]` — there is no
    documented field that is genuinely absent/null rather than sentinel-valued.


    Per `docs/02-response-codes.md`: Jamendo returns HTTP 200 with
    `headers.status: "failed"` for most API-level errors rather than a
    non-200 HTTP status. The 4xx/5xx responses below are modeled per the
    source docs but should be confirmed against the live API (see
    project-plan.md Step 3) before being treated as authoritative.
  license:
    name: Jamendo API Terms of Use
    url: https://devportal.jamendo.com/
servers:
  - url: https://api.jamendo.com/v3.0
    description: Jamendo API v3.0
tags:
  - name: tracks
    description: The track entity — Jamendo's primary catalog object.
  - name: albums
    description: The album entity.
  - name: artists
    description: The artist entity.
  - name: playlists
    description: User-curated dynamic collections of tracks.
  - name: radios
    description: Curated Jamendo radio streams.
  - name: reviews
    description: User-submitted album/track reviews.
  - name: users
    description: Jamendo user lookup and their relations to artists/albums/tracks.
  - name: feeds
    description: Editorial feeds shown on the jamendo.com homepage.
  - name: autocomplete
    description: Name-prefix autocomplete over tracks, albums, artists, and tags.
  - name: setuser
    description: >-
      OAuth2-protected write methods that modify the authenticated user's
      music library (fan, favorite, like, dislike, myalbums).

security: []

paths:
  /tracks:
    get:
      operationId: listTracks
      tags: [tracks]
      deprecated: false
      summary: List tracks
      description: >-
        Track is the king entity in Jamendo — the main, most flexible read
        method. Songs and tracks are the same entity. Since 2015, tracks can
        exist with no album ("singles") — `type` selects single, albumtrack,
        or both (default albumtrack only). `include` appends extra fields not
        returned by default: licenses, musicinfo, stats, lyrics. `order`
        supports many sort/boost combinations for charts and discovery; using
        a non-relevance `order` as the first sort loses search relevance —
        use `boost` instead to blend relevance with a rating signal.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FullCount'
        - name: order
          in: query
          required: false
          description: >-
            Sort field(s), default `relevance`. Suffix a field with `_asc` or
            `_desc`; rating-based orders default to (and force) descending.
          schema:
            type: array
            items:
              type: string
              enum:
                [relevance, buzzrate, downloads_week, downloads_month,
                 downloads_total, listens_week, listens_month, listens_total,
                 popularity_week, popularity_month, popularity_total, name,
                 album_name, artist_name, releasedate, duration, id,
                 relevance_asc, relevance_desc, buzzrate_asc, buzzrate_desc,
                 name_asc, name_desc, releasedate_asc, releasedate_desc,
                 duration_asc, duration_desc, id_asc, id_desc]
        - name: id
          in: query
          required: false
          description: One or more track id.
          schema: { type: array, items: { type: integer } }
        - name: name
          in: query
          required: false
          description: Exact track name.
          schema: { type: string }
        - name: namesearch
          in: query
          required: false
          description: track_name substring search, UTF-8.
          schema: { type: string }
        - name: type
          in: query
          required: false
          description: Track type filter. Default albumtrack only.
          schema:
            type: array
            items: { type: string, enum: [single, albumtrack] }
        - name: album_id
          in: query
          required: false
          description: One or more album id.
          schema: { type: array, items: { type: integer } }
        - name: album_name
          in: query
          required: false
          schema: { type: string }
        - name: artist_id
          in: query
          required: false
          description: One or more artist id.
          schema: { type: array, items: { type: integer } }
        - name: artist_name
          in: query
          required: false
          schema: { type: string }
        - name: content_id_free
          in: query
          required: false
          description: Content ID free filter.
          schema: { type: boolean }
        - name: datebetween
          in: query
          required: false
          description: Release date range, both bounds required.
          schema: { type: string, format: date, examples: ["2020-01-01_2020-12-31"] }
        - name: featured
          in: query
          required: false
          description: Featured (Jamendo-team-selected) tracks only.
          schema: { type: string, enum: ["true", "1"] }
        - $ref: '#/components/parameters/ImageSizeStandard'
        - $ref: '#/components/parameters/AudioFormat'
        - $ref: '#/components/parameters/AudioDLFormat'
        - name: tags
          in: query
          required: false
          description: >-
            Boolean AND tag search (genre/instrument/theme/nc). Some
            synonym/language mapping applies; English recommended.
          schema: { type: array, items: { type: string } }
        - name: fuzzytags
          in: query
          required: false
          description: Fuzzy OR tag search.
          schema: { type: array, items: { type: string } }
        - name: acousticelectric
          in: query
          required: false
          schema: { type: string, enum: [acoustic, electric] }
        - name: vocalinstrumental
          in: query
          required: false
          schema: { type: string, enum: [vocal, instrumental] }
        - name: gender
          in: query
          required: false
          description: Singer gender (vocal tracks only).
          schema: { type: string, enum: [male, female] }
        - name: speed
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [verylow, low, medium, high, veryhigh] }
        - name: lang
          in: query
          required: false
          description: Lyrics language, 2-letter code.
          schema: { type: array, items: { type: string, minLength: 2, maxLength: 2 } }
        - name: durationbetween
          in: query
          required: false
          description: Track duration range in seconds, both bounds required, `int_int`.
          schema: { type: string, examples: ["60_300"] }
        - name: xartist
          in: query
          required: false
          description: Select tracks similar to a named non-Jamendo artist.
          schema: { type: string }
        - name: search
          in: query
          required: false
          description: Free text search across track/album/artist name and tags.
          schema: { type: string }
        - name: prolicensing
          in: query
          required: false
          description: Only tracks in the single-track commercial licensing program.
          schema: { type: boolean }
        - name: probackground
          in: query
          required: false
          description: Only tracks in the background-music commercial program.
          schema: { type: boolean }
        - name: ccsa
          in: query
          required: false
          description: Creative Commons Share Alike filter.
          schema: { type: boolean }
        - name: ccnd
          in: query
          required: false
          description: Creative Commons No Derivs filter.
          schema: { type: boolean }
        - name: ccnc
          in: query
          required: false
          description: Creative Commons Non Commercial filter.
          schema: { type: boolean }
        - name: include
          in: query
          required: false
          description: Append extra fields not returned by default.
          schema:
            type: array
            items: { type: string, enum: [licenses, musicinfo, stats, lyrics] }
        - name: groupby
          in: query
          required: false
          description: Aggregate results, one track per artist/album; use with `order` for charts.
          schema: { type: string, enum: [artist_id, album_id] }
        - name: boost
          in: query
          required: false
          description: >-
            Blend a rating signal into relevance-ordered search without
            losing relevance. Implicit default popularity_month at lower
            intensity than an explicit order.
          schema:
            type: string
            enum: [buzzrate, downloads_week, downloads_month, downloads_total, listens_week, listens_month, listens_total, popularity_week, popularity_month, popularity_total]
      responses:
        '200':
          description: List of tracks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  headers: { $ref: '#/components/schemas/Headers' }
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/Track' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /tracks/file:
    get:
      operationId: downloadTrackFile
      tags: [tracks]
      deprecated: false
      summary: Download or stream a track's audio file
      description: >-
        Exception to the normal response shape — HTTP-redirects to the
        requested audio file URL instead of returning a document. Does not
        inherit `tracks` parameter declarations. An invalid request triggers
        a plain HTTP error (404 or 500), not the standard `Error` JSON
        envelope. Since Apr 2022, returns 404 if `audiodownload_allowed` /
        `track_audiodownload_allowed` is false for the requested track.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/FullCount'
        - $ref: '#/components/parameters/AudioFormat'
        - name: action
          in: query
          required: false
          description: Hints server-side request handling optimization.
          schema: { type: string, enum: [download, stream], default: download }
        - name: id
          in: query
          required: true
          description: Single track id (redirect semantics; only one).
          schema: { type: integer }
      responses:
        '302':
          description: >-
            Redirect to the audio file URL (binary redirect, not a JSON
            document).
          headers:
            Location:
              schema: { type: string, format: uri }
        '404':
          description: >-
            Track doesn't exist, or download not allowed. Plain HTTP error,
            not the standard `Error` JSON envelope.
        '500':
          description: Malformed request. Plain HTTP error, not the standard `Error` JSON envelope.

  /tracks/similar:
    get:
      operationId: listSimilarTracks
      tags: [tracks]
      deprecated: false
      summary: Find tracks similar to a given track
      description: >-
        Given a track id, finds similar Jamendo tracks. Similarity is based
        mostly on tags (genre, instrument, mood), then
        acousticelectric/vocalinstrumental, then less-weighted
        xartists_idstr/lang/gender. Results sorted by relevance via `score`
        (max 1). Source docs describe `no_artist` and `no_album` identically
        ("use that artist_id to exclude his tracks") — likely a copy-paste
        error where `no_album` should take an album_id; confirm semantics
        against the live API before relying on this.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FullCount'
        - $ref: '#/components/parameters/ImageSizeStandard'
        - $ref: '#/components/parameters/AudioFormat'
        - $ref: '#/components/parameters/AudioDLFormat'
        - name: include
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [licenses, musicinfo, stats, lyrics] }
        - name: id
          in: query
          required: true
          description: Reference track id to find similar tracks for.
          schema: { type: integer }
        - name: no_artist
          in: query
          required: false
          description: >-
            artist_id to exclude from results. Per docs, described
            identically to `no_album` — likely a doc copy-paste; confirm
            semantics against the live API.
          schema: { type: integer }
        - name: no_album
          in: query
          required: false
          description: See `no_artist` note; likely intended to take an album_id.
          schema: { type: integer }
      responses:
        '200':
          description: >-
            Tracks similar to the reference track, each with a `score`
            field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  headers: { $ref: '#/components/schemas/Headers' }
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/TrackWithScore' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /albums:
    get:
      operationId: listAlbums
      tags: [albums]
      deprecated: false
      summary: List albums
      description: >-
        Select and filter album entities. Albums have historically been
        Jamendo's central entity though tracks are now primary. Since 2015,
        tracks with no album ("singles") are also possible. `zip` is the
        URL for downloading the album's tracks as an mp3 192kbps zip (also
        downloadable directly via `/albums/file`).
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FullCount'
        - name: order
          in: query
          required: false
          description: Sort field(s); suffix _asc/_desc; popularity fields default+force desc.
          schema:
            type: array
            items: { type: string, enum: [name, id, releasedate, artist_id, artist_name, popularity_total, popularity_month, popularity_week] }
        - name: id
          in: query
          required: false
          schema: { type: array, items: { type: integer } }
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: namesearch
          in: query
          required: false
          schema: { type: string }
        - name: artist_id
          in: query
          required: false
          schema: { type: array, items: { type: integer } }
        - name: artist_name
          in: query
          required: false
          schema: { type: string }
        - name: datebetween
          in: query
          required: false
          description: Release date range, both bounds required.
          schema: { type: string, examples: ["2011-01-01_2012-01-01"] }
        - $ref: '#/components/parameters/ImageSizeStandard'
        - name: audioformat
          in: query
          required: false
          description: Audio format for `zip`/`fileurl`; only mp32 exists today.
          schema: { type: string, enum: [mp32] }
        - name: type
          in: query
          required: false
          description: Release type filter, default album+single.
          schema:
            type: array
            items: { type: string, enum: [single, album] }
      responses:
        '200':
          description: List of albums.
          content:
            application/json:
              schema:
                type: object
                properties:
                  headers: { $ref: '#/components/schemas/Headers' }
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/Album' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /albums/file:
    get:
      operationId: downloadAlbumFile
      tags: [albums]
      deprecated: false
      summary: Download an album's zip file
      description: >-
        Exception to the normal response shape — HTTP-redirects to the
        requested zip file URL instead of returning a document. Does not
        inherit `albums` parameter declarations. An invalid request triggers
        a plain HTTP error (404 or 500), not the standard `Error` JSON
        envelope. Since Apr 2022, returns 404 if `zip_allowed` is false for
        the requested album.
      security:
        - apikey_auth: []
      parameters:
        - name: id
          in: query
          required: true
          description: Single album id (redirect semantics; only one).
          schema: { type: integer }
        - name: audioformat
          in: query
          required: false
          description: Only mp32 (mp3 192kbps) exists today.
          schema: { type: string, enum: [mp32] }
      responses:
        '302':
          description: Redirect to the zip file URL (binary redirect, not a JSON document).
          headers:
            Location:
              schema: { type: string, format: uri }
        '404':
          description: >-
            Album or file doesn't exist, or `zip_allowed` is false. Plain
            HTTP error, not the standard `Error` JSON envelope.
        '500':
          description: Malformed request. Plain HTTP error, not the standard `Error` JSON envelope.

  /albums/tracks:
    get:
      operationId: listAlbumTracks
      tags: [albums]
      deprecated: false
      summary: List albums with their tracks
      description: >-
        Selects and filters album entities together with their belonging
        tracks. Returns the same fields as `/albums`, plus a nested `tracks`
        array with per-track fields.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FullCount'
        - name: order
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [name, id, releasedate, artist_id, artist_name, popularity_total, popularity_month, popularity_week, track_id, track_name, track_position] }
        - name: id
          in: query
          required: false
          schema: { type: array, items: { type: integer } }
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: namesearch
          in: query
          required: false
          schema: { type: string }
        - name: artist_id
          in: query
          required: false
          schema: { type: array, items: { type: integer } }
        - name: artist_name
          in: query
          required: false
          schema: { type: string }
        - name: datebetween
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/ImageSizeStandard'
        - $ref: '#/components/parameters/AudioFormat'
        - name: type
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [single, album] }
        - name: track_id
          in: query
          required: false
          schema: { type: array, items: { type: integer } }
        - name: track_name
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/AudioDLFormat'
      responses:
        '200':
          description: Albums with their nested tracks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  headers: { $ref: '#/components/schemas/Headers' }
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/AlbumWithTracks' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /albums/musicinfo:
    get:
      operationId: listAlbumsMusicinfo
      tags: [albums]
      deprecated: false
      summary: List albums with tags and description
      description: >-
        Returns the tags list of each album and its description (HTML) if
        it exists. Adds a `tag` filter (single tag only) on top of all
        `/albums` parameters.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FullCount'
        - name: order
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [name, id, releasedate, artist_id, artist_name, popularity_total, popularity_month, popularity_week] }
        - name: id
          in: query
          required: false
          schema: { type: array, items: { type: integer } }
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: namesearch
          in: query
          required: false
          schema: { type: string }
        - name: artist_id
          in: query
          required: false
          schema: { type: array, items: { type: integer } }
        - name: artist_name
          in: query
          required: false
          schema: { type: string }
        - name: datebetween
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/ImageSizeStandard'
        - name: audioformat
          in: query
          required: false
          schema: { type: string, enum: [mp32] }
        - name: type
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [single, album] }
        - name: tag
          in: query
          required: false
          description: Filter by one tag; English vocabulary recommended, no synonym support.
          schema: { type: string }
      responses:
        '200':
          description: Albums with musicinfo (tags + localized description).
          content:
            application/json:
              schema:
                type: object
                properties:
                  headers: { $ref: '#/components/schemas/Headers' }
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/AlbumMusicInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /artists:
    get:
      operationId: listArtists
      tags: [artists]
      deprecated: false
      summary: List artists
      description: >-
        The artist entity, second most important after tracks. Filters by
        obvious parameters and returns main fields only; submethods
        (artists/tracks, artists/albums, artists/locations,
        artists/musicinfo) provide more detail.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FullCount'
        - name: order
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [name, id, joindate, popularity_total, popularity_month, popularity_week] }
        - name: id
          in: query
          required: false
          schema: { type: array, items: { type: integer } }
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: namesearch
          in: query
          required: false
          schema: { type: string }
        - name: hasimage
          in: query
          required: false
          schema: { type: string, enum: ["true", "1"] }
        - name: datebetween
          in: query
          required: false
          description: Artist join-date range.
          schema: { type: string }
      responses:
        '200':
          description: List of artists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  headers: { $ref: '#/components/schemas/Headers' }
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/Artist' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /artists/tracks:
    get:
      operationId: listArtistTracks
      tags: [artists]
      deprecated: false
      summary: List artists with their tracks
      description: >-
        Returns each artist's tracks as a subentity. `track_type` selects
        singles, album tracks, or both — default albumtrack only, since
