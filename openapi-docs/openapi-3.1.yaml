                fullcount: { type: boolean, default: false }
                access_token: { type: string, description: OAuth2 access token with `music` scope, for the user being updated. }
                artist_id: { type: integer, description: Artist to become a fan of. }
      responses:
        '200':
          description: Success. Empty `results` — the response only confirms via `headers.status`/`code`.
