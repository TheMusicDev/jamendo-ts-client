openapi: 3.0.3

info:
  title: Jamendo API
  version: "3.0.0"
  license:
    name: MIT
    url: https://github.com/TheMusicDev/jamendo-openapi/blob/main/LICENSE
  description: >-
    Community-maintained OpenAPI description of the Jamendo API v3.0 — a
    RESTlike API over a catalog of ~500,000 Creative-Commons-licensed
    tracks, plus OAuth2-protected write methods for managing a user's
    Jamendo library. Every GET call returns a document in the requested
    `format` (`json`, `jsonpretty`, or `xml`) — this spec describes the
    `json`/`jsonpretty` document shape; `xml` returns an equivalent
    structure serialized as XML. Every response document includes a
    `headers` object (`status`, `code`, `error_message`, `warnings`,
    plus optional `results_count` / `results_fullcount`) and a `results`
    payload. Note that Jamendo's API frequently returns HTTP 200 with
    `headers.status: "failed"` for API-level errors rather than a
    non-200 HTTP status; this spec models the documented 4xx/5xx
    responses per Jamendo's own error-code table, but that behavior has
    not yet been reconfirmed against the live API (see project-plan.md
    Step 3). Signing up at https://devportal.jamendo.com/ and creating
    an "application" is required to obtain a `client_id`; use
    `709fa152` for read-only testing only.
  x-source: https://developer.jamendo.com/v3.0

servers:
  - url: https://api.jamendo.com/v3.0
    description: Jamendo API v3.0 (HTTPS — required for OAuth2, recommended everywhere)
  - url: http://api.jamendo.com/v3.0
    description: Jamendo API v3.0 (HTTP — read methods only)

tags:
  - name: tracks
    description: Tracks — the primary Jamendo entity.
  - name: albums
    description: Albums.
  - name: artists
    description: Artists.
  - name: playlists
    description: User-curated playlists.
  - name: radios
    description: Jamendo radios.
  - name: reviews
    description: Album and track reviews.
  - name: users
    description: Jamendo user lookup and their relations to artists/albums/tracks.
  - name: feeds
    description: Editorial feeds shown on the jamendo.com homepage.
  - name: autocomplete
    description: Autocomplete over tracks, albums, artists, and tags.
  - name: setuser
    description: OAuth2-protected write methods that modify an authenticated user's library.

security:
  - apikey_auth: []

paths:
  /tracks:
    get:
      operationId: listTracks
      tags: [tracks]
      summary: List tracks
      description: >-
        Track is the king entity in Jamendo — this is the main, most
        flexible read method. Unlike some other API frameworks
        (Musicbrainz, Echonest), songs and tracks are the same entity
        here. Since 2015, tracks can exist with no album ("singles") —
        `type` selects single, albumtrack, or both (default albumtrack
        only). `include` appends extra fields not returned by default:
        licenses, musicinfo, stats, lyrics. Using a non-relevance
        `order` as the first sort loses search relevance — use `boost`
        instead to blend relevance with a rating signal.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FullCount'
        - name: order
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                [relevance, buzzrate, downloads_week, downloads_month,
                 downloads_total, listens_week, listens_month, listens_total,
                 popularity_week, popularity_month, popularity_total, name,
                 album_name, artist_name, releasedate, duration, id,
                 relevance_asc, relevance_desc, buzzrate_asc, buzzrate_desc,
                 name_asc, name_desc, releasedate_asc, releasedate_desc,
                 duration_asc, duration_desc, id_asc, id_desc]
            default: [relevance]
          style: form
          explode: false
          description: Sort field(s); suffix _asc/_desc. Rating-based orders default to, and force, desc.
        - name: id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
          description: One or more track id.
        - name: name
          in: query
          schema: {type: string}
          description: Exact track name.
        - name: namesearch
          in: query
          schema: {type: string}
          description: Substring search on track_name (UTF-8).
        - name: type
          in: query
          schema:
            type: array
            items: {type: string, enum: [single, albumtrack]}
            default: [albumtrack]
          style: form
          explode: false
          description: Track type filter.
        - name: album_id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
          description: One or more album id.
        - name: album_name
          in: query
          schema: {type: string}
        - name: artist_id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
          description: One or more artist id.
        - name: artist_name
          in: query
          schema: {type: string}
        - name: content_id_free
          in: query
          schema: {type: boolean}
          description: Filter by Content ID free status.
        - $ref: '#/components/parameters/DateBetween'
        - name: featured
          in: query
          schema: {type: string, enum: ["true", "1"]}
          description: Only Jamendo-team-selected featured tracks.
        - $ref: '#/components/parameters/ImageSize'
        - $ref: '#/components/parameters/AudioFormat'
        - $ref: '#/components/parameters/AudioDlFormat'
        - name: tags
          in: query
          schema: {type: array, items: {type: string}}
          style: form
          explode: false
          description: Boolean AND tag search (genre/instrument/theme/nc). English vocabulary recommended.
        - name: fuzzytags
          in: query
          schema: {type: array, items: {type: string}}
          style: form
          explode: false
          description: Fuzzy OR tag search.
        - name: acousticelectric
          in: query
          schema: {type: string, enum: [acoustic, electric]}
        - name: vocalinstrumental
          in: query
          schema: {type: string, enum: [vocal, instrumental]}
        - name: gender
          in: query
          schema: {type: string, enum: [male, female]}
          description: Singer gender filter (vocal tracks only).
        - name: speed
          in: query
          schema:
            type: array
            items: {type: string, enum: [verylow, low, medium, high, veryhigh]}
          style: form
          explode: false
        - name: lang
          in: query
          schema: {type: array, items: {type: string}}
          style: form
          explode: false
          description: Lyrics language, 2-letter code(s).
        - name: durationbetween
          in: query
          schema: {type: string, pattern: '^\d+_\d+$'}
          description: Track duration range in seconds, both bounds required (int_int).
        - name: xartist
          in: query
          schema: {type: string}
          description: Select tracks similar to a named non-Jamendo artist.
        - name: search
          in: query
          schema: {type: string}
          description: Free text search across track/album/artist name and tags.
        - name: prolicensing
          in: query
          schema: {type: boolean}
          description: Only tracks in the single-track commercial licensing program.
        - name: probackground
          in: query
          schema: {type: boolean}
          description: Only tracks in the background-music commercial program.
        - name: ccsa
          in: query
          schema: {type: boolean}
          description: Creative Commons Share Alike filter.
        - name: ccnd
          in: query
          schema: {type: boolean}
          description: Creative Commons No Derivs filter.
        - name: ccnc
          in: query
          schema: {type: boolean}
          description: Creative Commons Non Commercial filter.
        - $ref: '#/components/parameters/Include'
        - name: groupby
          in: query
          schema: {type: string, enum: [artist_id, album_id]}
          description: Aggregate results to one track per artist/album (use with order for charts).
        - name: boost
          in: query
          schema:
            type: string
            enum:
              [buzzrate, downloads_week, downloads_month, downloads_total,
               listens_week, listens_month, listens_total, popularity_week,
               popularity_month, popularity_total]
          description: Blend a rating signal into relevance-ordered search without losing relevance. Implicit default is a low-intensity popularity_month boost.
      responses:
        '200':
          description: A list of tracks.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TracksResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
        '500': {$ref: '#/components/responses/ErrorResponse'}

  /tracks/file:
    get:
      operationId: downloadTrackFile
      tags: [tracks]
      summary: Download or stream a track's audio file
      description: >-
        Exception to the normal response shape — HTTP-redirects to the
        requested audio file URL instead of returning a document. Does
        not inherit `tracks` parameter declarations. Since Apr 2022,
        returns 404 if the track's download is not allowed.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/FullCount'
        - $ref: '#/components/parameters/AudioFormat'
        - name: action
          in: query
          schema: {type: string, enum: [download, stream], default: download}
          description: Hints server-side request handling optimization.
        - name: id
          in: query
          required: true
          schema: {type: integer}
          description: Single track id (redirect semantics — only one id accepted).
      responses:
        '302': {$ref: '#/components/responses/FileRedirect'}
        '404': {$ref: '#/components/responses/FileNotFound'}
        '500': {$ref: '#/components/responses/FileServerError'}

  /tracks/similar:
    get:
      operationId: listSimilarTracks
      tags: [tracks]
      summary: Find tracks similar to a given track
      description: >-
        Given a track id, finds similar Jamendo tracks. Similarity is
        based mostly on tags (genre, instrument, mood), then
        acousticelectric/vocalinstrumental, then less-weighted
        xartists_idstr/lang/gender. Results are sorted by relevance via
        the `score` field.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FullCount'
        - $ref: '#/components/parameters/ImageSize'
        - $ref: '#/components/parameters/AudioFormat'
        - $ref: '#/components/parameters/AudioDlFormat'
        - $ref: '#/components/parameters/Include'
        - name: id
          in: query
          required: true
          schema: {type: integer}
          description: Reference track id to find similar tracks for.
        - name: no_artist
          in: query
          schema: {type: integer}
          description: >-
            artist_id to exclude from results. Source docs describe
            this identically to no_album (likely a doc copy-paste error)
            — confirm actual semantics against the live API.
        - name: no_album
          in: query
          schema: {type: integer}
          description: artist_id to exclude from results (see no_artist note).
      responses:
        '200':
          description: A list of tracks similar to the reference track, each with a similarity `score`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimilarTracksResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
        '500': {$ref: '#/components/responses/ErrorResponse'}

  /albums:
    get:
      operationId: listAlbums
      tags: [albums]
      summary: List albums
      description: >-
        Select and filter album entities, returning main album fields.
        Since 2015, tracks with no album ("singles") are also possible.
        `zip_allowed` (added Feb 2021) indicates whether the artist
        permits zip download — `zip` becomes empty when false.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FullCount'
        - name: order
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                [name, id, releasedate, artist_id, artist_name,
                 popularity_total, popularity_month, popularity_week,
                 name_asc, name_desc, id_asc, id_desc, releasedate_asc,
                 releasedate_desc]
          style: form
          explode: false
          description: Sort field(s); suffix _asc/_desc. Popularity fields default to, and force, desc.
        - name: id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
        - name: name
          in: query
          schema: {type: string}
        - name: namesearch
          in: query
          schema: {type: string}
        - name: artist_id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
        - name: artist_name
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/DateBetween'
        - $ref: '#/components/parameters/ImageSize'
        - name: audioformat
          in: query
          schema: {type: string, enum: [mp32]}
          description: Audio format for `fileurl`; only mp32 exists today.
        - name: type
          in: query
          schema:
            type: array
            items: {type: string, enum: [single, album]}
            default: [album, single]
          style: form
          explode: false
      responses:
        '200':
          description: A list of albums.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlbumsResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
        '500': {$ref: '#/components/responses/ErrorResponse'}

  /albums/file:
    get:
      operationId: downloadAlbumFile
      tags: [albums]
      summary: Download an album's zip file
      description: >-
        Exception to the normal response shape — HTTP-redirects to the
        requested zip file URL. Does not inherit `albums` parameter
        declarations. Since Apr 2022, returns 404 if `zip_allowed` is
        false for the requested album.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - name: id
          in: query
          required: true
          schema: {type: integer}
          description: Single album id (redirect semantics — only one id accepted).
        - name: audioformat
          in: query
          schema: {type: string, enum: [mp32]}
          description: Only mp32 (mp3 192kbps) exists today.
      responses:
        '302': {$ref: '#/components/responses/FileRedirect'}
        '404': {$ref: '#/components/responses/FileNotFound'}
        '500': {$ref: '#/components/responses/FileServerError'}

  /albums/tracks:
    get:
      operationId: listAlbumTracks
      tags: [albums]
      summary: List albums with their tracks
      description: >-
        Selects and filters album entities together with their
        belonging tracks. Returns the same fields as `albums`, plus a
        nested `tracks` array.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FullCount'
        - name: order
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                [name, id, releasedate, artist_id, artist_name,
                 popularity_total, popularity_month, popularity_week,
                 track_id, track_name, track_position]
          style: form
          explode: false
        - name: id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
        - name: name
          in: query
          schema: {type: string}
        - name: namesearch
          in: query
          schema: {type: string}
        - name: artist_id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
        - name: artist_name
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/DateBetween'
        - $ref: '#/components/parameters/ImageSize'
        - $ref: '#/components/parameters/AudioFormat'
        - name: type
          in: query
          schema:
            type: array
            items: {type: string, enum: [single, album]}
            default: [album, single]
          style: form
          explode: false
        - name: track_id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
        - name: track_name
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/AudioDlFormat'
      responses:
        '200':
          description: A list of albums, each with its nested tracks.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlbumTracksResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
        '500': {$ref: '#/components/responses/ErrorResponse'}

  /albums/musicinfo:
    get:
      operationId: listAlbumsMusicinfo
      tags: [albums]
      summary: List albums with tags and description
      description: >-
        Returns the tags list of each album and its description (HTML)
        if it exists. Adds a `tag` filter parameter (single tag only)
        on top of all `albums` parameters.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FullCount'
        - name: order
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                [name, id, releasedate, artist_id, artist_name,
                 popularity_total, popularity_month, popularity_week]
          style: form
          explode: false
        - name: id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
        - name: name
          in: query
          schema: {type: string}
        - name: namesearch
          in: query
          schema: {type: string}
        - name: artist_id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
        - name: artist_name
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/DateBetween'
        - $ref: '#/components/parameters/ImageSize'
        - name: audioformat
          in: query
          schema: {type: string, enum: [mp32]}
        - name: type
          in: query
          schema:
            type: array
            items: {type: string, enum: [single, album]}
            default: [album, single]
          style: form
          explode: false
        - name: tag
          in: query
          schema: {type: string}
          description: Filter by one tag; English vocabulary recommended, no synonym support.
      responses:
        '200':
          description: A list of albums, each with musicinfo tags and description.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlbumsMusicinfoResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
        '500': {$ref: '#/components/responses/ErrorResponse'}

  /artists:
    get:
      operationId: listArtists
      tags: [artists]
      summary: List artists
      description: >-
        The artist entity, second most important after tracks. Filters
        by obvious parameters and returns main fields only; submethods
        (artists/tracks, artists/albums, artists/locations,
        artists/musicinfo) provide more detail.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FullCount'
        - name: order
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [name, id, joindate, popularity_total, popularity_month, popularity_week]
          style: form
          explode: false
        - name: id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
        - name: name
          in: query
          schema: {type: string}
        - name: namesearch
          in: query
          schema: {type: string}
        - name: hasimage
          in: query
          schema: {type: string, enum: ["true", "1"]}
        - $ref: '#/components/parameters/DateBetween'
      responses:
        '200':
          description: A list of artists.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtistsResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
        '500': {$ref: '#/components/responses/ErrorResponse'}

  /artists/tracks:
    get:
      operationId: listArtistTracks
      tags: [artists]
      summary: List artists with their tracks
      description: >-
        Returns each artist's tracks as a subentity. Use `track_type`
        to select singles, album tracks, or both — default is
        albumtrack only, since singles leave all `album_*` fields empty.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FullCount'
        - name: order
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                [name, id, joindate, popularity_total, popularity_month,
                 popularity_week, track_name, track_id, track_releasedate]
          style: form
          explode: false
        - name: id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
        - name: name
          in: query
          schema: {type: string}
        - name: namesearch
          in: query
          schema: {type: string}
        - name: hasimage
          in: query
          schema: {type: string, enum: ["true", "1"]}
        - $ref: '#/components/parameters/DateBetween'
        - name: track_id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
        - name: track_name
          in: query
          schema: {type: string}
        - name: track_type
          in: query
          schema:
            type: array
            items: {type: string, enum: [single, albumtrack]}
            default: [albumtrack]
          style: form
          explode: false
        - name: album_datebetween
          in: query
          schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}_\d{4}-\d{2}-\d{2}$'}
          description: Album creation date range.
        - name: album_id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
        - name: album_name
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/ImageSize'
        - $ref: '#/components/parameters/AudioFormat'
        - $ref: '#/components/parameters/AudioDlFormat'
      responses:
        '200':
          description: A list of artists, each with nested tracks.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtistTracksResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
        '500': {$ref: '#/components/responses/ErrorResponse'}

  /artists/albums:
    get:
      operationId: listArtistAlbums
      tags: [artists]
      summary: List artists with their albums
      description: Displays each artist's albums as a subentity, reorderable/filterable by basic parameters.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FullCount'
        - name: order
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                [name, id, joindate, popularity_total, popularity_month,
                 popularity_week, album_name, album_id, album_releasedate]
          style: form
          explode: false
        - name: id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
        - name: name
          in: query
          schema: {type: string}
        - name: namesearch
          in: query
          schema: {type: string}
        - name: hasimage
          in: query
          schema: {type: string, enum: ["true", "1"]}
        - $ref: '#/components/parameters/DateBetween'
        - name: album_id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
        - name: album_name
          in: query
          schema: {type: string}
        - name: album_datebetween
          in: query
          schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}_\d{4}-\d{2}-\d{2}$'}
        - $ref: '#/components/parameters/ImageSize'
      responses:
        '200':
          description: A list of artists, each with nested albums.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtistAlbumsResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
        '500': {$ref: '#/components/responses/ErrorResponse'}

  /artists/locations:
    get:
      operationId: listArtistLocations
      tags: [artists]
      summary: List artists' declared geographical locations
      description: >-
        Selects and filters geographical locations artists have
        declared as their reference. Filter by country and/or city
        name, or by a lat/long coordinate pair (`location_coords`) plus
        a km radius (`location_radius`).
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FullCount'
        - name: order
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [name, id, joindate, popularity_total, popularity_month, popularity_week]
          style: form
          explode: false
        - name: id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
        - name: name
          in: query
          schema: {type: string}
        - name: namesearch
          in: query
          schema: {type: string}
        - name: hasimage
          in: query
          schema: {type: string, enum: ["true", "1"]}
        - $ref: '#/components/parameters/DateBetween'
        - name: haslocation
          in: query
          schema: {type: boolean}
          description: Only artists with (true) or without (false) declared locations.
        - name: location_country
          in: query
          schema: {type: array, items: {type: string}}
          style: form
          explode: false
          description: Artist country, ISO 3166-1 alpha-3 code(s) (e.g. USA, ITA, GBR, DEU, FRA).
        - name: location_city
          in: query
          schema: {type: string}
        - name: location_coords
          in: query
          schema: {type: string, pattern: '^-?\d+(\.\d+)?_-?\d+(\.\d+)?$'}
          description: '`<latitude>_<longitude>` coordinate pair, both numeric.'
        - name: location_radius
          in: query
          schema: {type: integer, default: 1}
          description: Search radius in km around location_coords; ignored if location_coords not set.
      responses:
        '200':
          description: A list of artists, each with nested declared locations.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtistLocationsResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
        '500': {$ref: '#/components/responses/ErrorResponse'}

  /artists/musicinfo:
    get:
      operationId: listArtistsMusicinfo
      tags: [artists]
      summary: List artists with tags and description
      description: >-
        Returns the tags list of each artist and its description (HTML)
        if it exists. Adds a `tag` filter parameter (single tag only)
        on top of all `artists` parameters.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FullCount'
        - name: order
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [name, id, joindate, popularity_total, popularity_month, popularity_week]
          style: form
          explode: false
        - name: id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
        - name: name
          in: query
          schema: {type: string}
        - name: namesearch
          in: query
          schema: {type: string}
        - name: hasimage
          in: query
          schema: {type: string, enum: ["true", "1"]}
        - $ref: '#/components/parameters/DateBetween'
        - name: tag
          in: query
          schema: {type: string}
          description: Filter by one tag; English vocabulary recommended, no synonym support.
      responses:
        '200':
          description: A list of artists, each with musicinfo tags and description.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtistsMusicinfoResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
        '500': {$ref: '#/components/responses/ErrorResponse'}

  /playlists:
    get:
      operationId: listPlaylists
      tags: [playlists]
      summary: List playlists
      description: >-
        A playlist is a dynamic collection of tracks; the owning user
        can modify/delete/publish/mask it at any time. `zip` is the URL
        for the playlist's tracks as a high-quality mp3 zip — the zip
        may contain fewer tracks than the playlist actually has
        (server-side ~100-track internal limit).
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FullCount'
        - name: order
          in: query
          schema:
            type: array
            items: {type: string, enum: [name, id, creationdate]}
          style: form
          explode: false
        - name: id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
        - name: name
          in: query
          schema: {type: string}
        - name: namesearch
          in: query
          schema: {type: string}
        - name: user_id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
          description: One or more author id (no access_token required).
        - name: access_token
          in: query
          schema: {type: string}
          description: OAuth2 access token, to scope results to a specific authenticated Jamendo user.
        - name: user_name
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/DateBetween'
        - name: audioformat
          in: query
          schema: {type: string, enum: [mp32]}
          description: Audio format for fileurl; only mp32 exists today.
      responses:
        '200':
          description: A list of playlists.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlaylistsResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
        '500': {$ref: '#/components/responses/ErrorResponse'}

  /playlists/file:
    get:
      operationId: downloadPlaylistFile
      tags: [playlists]
      summary: Download a playlist's zip file
      description: >-
        Exception to the normal response shape — HTTP-redirects to the
        requested zip file URL. Does not inherit `playlists` parameter
        declarations.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - name: id
          in: query
          required: true
          schema: {type: integer}
          description: Single playlist id (redirect semantics — only one id accepted).
        - name: audioformat
          in: query
          schema: {type: string, enum: [mp32]}
          description: Only mp32 (mp3 192kbps) exists today.
      responses:
        '302': {$ref: '#/components/responses/FileRedirect'}
        '404': {$ref: '#/components/responses/FileNotFound'}
        '500': {$ref: '#/components/responses/FileServerError'}

  /playlists/tracks:
    get:
      operationId: listPlaylistTracks
      tags: [playlists]
      summary: List playlists with their tracks
      description: >-
        Returns playlist entities with the list of belonging tracks.
        One of `id`, `name`, `user_id`, `access_token`, or `user_name`
        is required in addition to `client_id`. `track_type` selects
        singles, album tracks, or both — default albumtrack only, since
        singles leave album_* fields empty.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FullCount'
        - name: order
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [name, id, creationdate, track_id, track_name, track_added_date, track_position]
          style: form
          explode: false
        - name: id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
          description: One or more playlist id (one of id/name/user_id/access_token/user_name required).
        - name: name
          in: query
          schema: {type: string}
        - name: namesearch
          in: query
          schema: {type: string}
        - name: user_id
          in: query
          schema: {type: array, items: {type: integer}}
          style: form
          explode: false
        - name: access_token
          in: query
          schema: {type: string}
        - name: user_name
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/DateBetween'
        - $ref: '#/components/parameters/AudioFormat'
        - name: track_type
          in: query
          schema:
            type: array
            items: {type: string, enum: [single, albumtrack]}
            default: [albumtrack]
          style: form
          explode: false
        - $ref: '#/components/parameters/ImageSize'
        - name: positionbetween
          in: query
          schema: {type: string, pattern: '^\d+_\d+$'}
          description: Filter by track position range in the playlist, both bounds required (int_int).
        - $ref: '#/components/parameters/AudioDlFormat'
      responses:
        '200':
          description: A list of playlists, each with nested tracks.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlaylistTracksResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
        '500': {$ref: '#/components/responses/ErrorResponse'}

  /radios:
    get:
      operationId: listRadios
      tags: [radios]
      summary: List Jamendo radios
      description: >-
        Returns the list of existing Jamendo radios with image and
        name. Each radio id/name can be used with radios/stream.
        Commercial/direct-indirect use requires purchasing a commercial
        license (licensing.jamendo.com); a paid license upgrades the
        developer account to access `type=pro` radios.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FullCount'
        - name: order
          in: query
          schema:
            type: array
            items: {type: string, enum: [id, name, dispname]}
          style: form
          explode: false
        - name: id
          in: query
          schema: {type: integer}
        - name: type
          in: query
          schema: {type: string, enum: [www, pro], default: www}
          description: www = public radios (default); pro = commercial/licensed only.
        - name: name
          in: query
          schema: {type: string}
        - name: imagesize
          in: query
          schema: {type: integer, enum: [150, 30]}
      responses:
        '200':
          description: A list of radios.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RadiosResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
        '500': {$ref: '#/components/responses/ErrorResponse'}

  /radios/stream:
    get:
      operationId: getRadioStream
      tags: [radios]
      summary: Get a radio's stream URL and currently playing track
      description: >-
        **Reliability warning (per Jamendo's own docs):** the returned
        `stream` link "is not more working, and it could be never
        fixed." Given a radio id or name, returns the streaming URL, a
        `playingnow` object describing the currently streamed track,
        and `callmeback` — how many ms until the current track finishes
        and the next one starts. One of `id` or `name` is required in
        addition to `client_id`.
      security:
        - apikey_auth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Callback'
        - $ref: '#/components/parameters/FullCount'
        - name: id
          in: query
          schema: {type: integer}
          description: A radio id (id or name required).
        - name: type
          in: query
          schema: {type: string, enum: [www, pro], default: www}
        - name: name
          in: query
          schema: {type: string}
          description: Radio name (id or name required).
        - name: imagesize
          in: query
          schema: {type: integer, enum: [150, 30]}
        - name: track_imagesize
          in: query
          schema:
            type: integer
            enum: [25, 35, 50, 55, 60, 65, 70, 75, 85, 100, 130, 150, 200, 300, 400, 500, 600]
          description: Track cover pixel size.
      responses:
        '200':
          description: The radio's stream URL and currently playing track.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RadioStreamResponse'}
        '400': {$ref: '#/components/responses/ErrorResponse'}
        '401': {$ref: '#/components/responses/ErrorResponse'}
        '403': {$ref: '#/components/responses/ErrorResponse'}
        '404': {$ref: '#/components/responses/ErrorResponse'}
        '429': {$ref: '#/components/responses/ErrorResponse'}
        '500': {$ref: '#/components/responses/ErrorResponse'}

  /reviews/albums:
