# GitHub auto-generated release notes config.
# Groups conventional-commit messages into labeled sections in the
# GitHub Release page (and the auto-notes `gh release create --generate-notes`
# writes). PR titles / commit subjects prefixed `feat:`, `fix:`, etc. land in
# the matching section; anything else falls under "Other changes".
# Docs: https://docs.github.com/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - dependencies
      - ignore-for-release
  categories:
    - title: 'Features'
      labels:
        - feature
      collapse-after: 5
    - title: 'Bug fixes'
      labels:
        - bug
      collapse-after: 5
    - title: 'Maintenance'
      labels:
        - chore
        - ci
        - docs
        - refactor
      collapse-after: 10
    - title: 'Other changes'
      labels:
        - '*'