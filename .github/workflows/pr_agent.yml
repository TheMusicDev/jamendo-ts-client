name: PR-Agent review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Run PR-Agent on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@f6af7d77554ff8d26adffded077e6461329e92fa # v0.42.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER.KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # PR-Agent is advisory (workflow stays green on LLM failure, not a
          # merge gate), so free-first is the right cost/quality trade. Ladder:
          # 1. z-ai/glm-5.2:free — free, 256k ctx, MULTI-provider (Decart,
          #    Fireworks, Venice, Baseten +27) so OpenRouter reroutes on a
          #    provider 502 (unlike single-provider Stealth free models).
          #    Tool calling + structured output. Solid for code review.
          # 2. openrouter/free — free meta-router across ~24 free variants.
          # 3. anthropic/claude-haiku-4.5 — paid last resort ($1/M in, $5/M
          #    out) only fires when both free tiers error. Needs the $10
          #    balance (also unlocks 1000 free/day cap).
          # Caveat: fallback fires on ERROR only. A free model that succeeds
          # with a weak review is kept — no quality escalation to Haiku.
          # Acceptable for advisory review.
          config.model: 'openrouter/z-ai/glm-5.2:free'
          # Light tier (/describe, /ask, /update_changelog) routes to Ollama
          # Cloud — a genuinely DIFFERENT provider from OpenRouter, so its rate
          # limits are independent (no shared OpenRouter 20 RPM pool, no
          # correlated 429s). Free tier: 1 concurrent, light usage, resets
          # every 5h session / 7d weekly. ollama_chat/ prefix (not ollama/)
          # enables Bearer auth via OLLAMA_API_KEY. gpt-oss:120b-cloud is a
          # level-4 (heavy) model — may exhaust the free weekly quota faster
          # than a lighter model; swap to e.g. gpt-oss:20b-cloud if it does.
          config.model_weak: 'ollama_chat/gpt-oss:120b-cloud'
          OLLAMA_API_BASE: 'https://ollama.com'
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          config.fallback_models: '["openrouter/free","openrouter/anthropic/claude-haiku-4.5"]'
          # custom_model_max_tokens declares Haiku's context window (input
          # budget), NOT output reservation. Haiku 4.5 has a 200k window.
          config.custom_model_max_tokens: '200000'
          # openrouter.max_tokens is the hard cap on COMPLETION (output) tokens
          # — the value OpenRouter reserves credits against (max_tokens ×
          # output price). Haiku = $5/M out, so 4000 out → $0.02 reserved/call,
          # affordable on a $10 balance. Reviews/improvements need a few
          # hundred output tokens; 4000 is ample headroom.
          openrouter.max_tokens: '4000'
          github_action_config.auto_review: 'true'
          github_action_config.auto_describe: 'true'
          github_action_config.auto_improve: 'false'
          github_action_config.handle_push_trigger: 'true'
          github_action_config.push_commands: '["/review"]'