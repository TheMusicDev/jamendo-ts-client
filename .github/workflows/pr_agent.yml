name: PR-Agent review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Run PR-Agent on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@f6af7d77554ff8d26adffded077e6461329e92fa # v0.42.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER.KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Paid primary for reliability (CI gate runs on every PR). Free tier
          # has no SLA and 502s on anonymous single-provider models (Stealth).
          # Haiku 4.5: $1/M in, $5/M out ≈ $0.01–0.05 per review. Supports tools.
          # Free router is the fallback — needs ≥$10 credits for 1000/day cap.
          config.model: 'openrouter/anthropic/claude-haiku-4.5'
          config.fallback_models: '["openrouter/free"]'
          # OpenRouter reserves max_tokens × output-price credits per call.
          # With $10 balance it caps reservation at ~8000 tokens; PR-Agent's
          # improve command requests 2× this value, so 4000 → 8000 requested,
          # under the credit limit. Reviews need a few hundred output tokens.
          config.custom_model_max_tokens: '4000'
          github_action_config.auto_review: 'true'
          github_action_config.auto_describe: 'true'
          github_action_config.auto_improve: 'true'
          github_action_config.handle_push_trigger: 'true'
          github_action_config.push_commands: '["/review", "/improve"]'