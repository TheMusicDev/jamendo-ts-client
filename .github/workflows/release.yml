name: Release

# Publishes to npm when a version tag (v*) is pushed.
# Trigger: `git tag v0.1.0 && git push --tags`.
# Requires repo secret `NPM_TOKEN` (granular publish token for
# @themusicdev/jamendo-ts-client). `id-token: write` enables npm provenance
# (sigstore build attestation — npm shows a green "Provenance" badge linking
# the tarball back to this exact commit).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check:types
      - run: bun test
        env:
          # integration tests skip without a client id — keeps the gate offline
          JAMENDO_CLIENT_ID: ''
      # `prepack` runs `bun run build` again before publish; harmless rebuild.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}