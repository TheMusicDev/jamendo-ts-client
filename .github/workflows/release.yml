name: Release

# Publishes to npm using Trusted Publishing (OIDC) — no NPM_TOKEN secret.
# Trigger: `git tag v0.1.0 && git push --tags`.
#
# How it works: GitHub mints a short-lived OIDC token (`id-token: write`);
# the npm CLI exchanges it for a one-time publish credential. npm trusts
# *this* repo + workflow because you configured it as a Trusted Publisher
# on npmjs.com (package → Settings → Trusted Publisher → GitHub Actions,
# org TheMusicDev / repo jamendo-ts-client / workflow release.yml).
# Provenance is generated automatically — no `--provenance` flag needed.
#
# First publish of a NEW package CANNOT use OIDC (npm has no package page
# to configure the trusted publisher on until the package exists). Publish
# the first version manually (`npm publish --access public`), then set up
# the trusted publisher, then this workflow takes over for later releases.
# See PUBLISH.md.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub Release after publish
  id-token: write # npm Trusted Publishing (OIDC) — no token secret needed

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    # Optional: lock to an environment that matches the npm Trusted Publisher
    # config. Add a `release` environment in repo settings for extra gating
    # (required reviewers, branch restrictions) if desired.
    environment: release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history — git-cliff needs every tag + commit to regenerate
          # CHANGELOG.md, not just the tagged commit.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check:types
      - run: bun run test
      # Regenerate CHANGELOG.md from conventional commits (cliff.toml) up to
      # and including this tag, then commit it back to main. Runs before
      # publish so a changelog failure blocks the release instead of leaving
      # a published version with a stale changelog.
      - uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --output CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: commit changelog
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged, skipping commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): update for $GITHUB_REF_NAME [skip ci]"
          git push origin HEAD:main
      # Trusted Publishing needs npm CLI v11.5.1+ on Node 22.14+ (Node 24
      # recommended). Bun's bundled npm-cli may not support the OIDC exchange,
      # so install the real npm CLI on Node 24 for the publish step.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      # Do NOT set NODE_AUTH_TOKEN — that forces the legacy token path and
      # disables OIDC. Provenance is automatic for public packages.
      - run: npm publish --access public
      # Create the GitHub Release with auto-generated notes (grouped by
      # conventional-commit type via .github/release.yml). GITHUB_REF_NAME is
      # the tag (e.g. v0.1.1). Runs after publish, so a failed publish skips
      # this too (the `needs`-like ordering of steps). Skip on the bootstrap
      # 0.1.0 run — that release is created by hand (see PUBLISH.md).
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}