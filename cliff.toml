# git-cliff configuration — generates CHANGELOG.md from conventional commits.
# https://git-cliff.org/docs/configuration
#
# Regenerated by release.yml on every version tag (see PUBLISH.md). Grouping
# mirrors commitlint's conventional-commit types (commitlint.config.json).

[changelog]
header = """
# Changelog

All notable changes to `@themusicdev/jamendo-ts-client` are documented here.
Generated by [git-cliff](https://git-cliff.org/) from conventional commits.

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
trim = true
render_always = true
postprocessors = [
    { pattern = '<REPO>', replace = "https://github.com/TheMusicDev/jamendo-ts-client" },
]

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
commit_preprocessors = [
    # Link bare "(#123)" issue/PR references to GitHub.
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](<REPO>/issues/${1}))" },
]
protect_breaking_commits = false
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 3 -->🚜 Refactor" },
    { message = "^doc", group = "<!-- 4 -->📚 Documentation" },
    { message = "^test", group = "<!-- 5 -->🧪 Testing" },
    { message = "^style", group = "<!-- 6 -->🎨 Styling" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore|^ci|^build", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
    { message = "^revert", group = "<!-- 8 -->◀️ Revert" },
    { message = "^Merge pull request", skip = true },
    { message = "^Merge branch", skip = true },
    { message = ".*", group = "<!-- 9 -->💼 Other" },
]
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = [
    { pattern = "#(\\d+)", href = "https://github.com/TheMusicDev/jamendo-ts-client/issues/$1" },
]
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
